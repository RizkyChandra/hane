[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RizkyChandra/hane"

[workspace.dependencies]
hane-geom = { path = "crates/hane-geom" }
hane-path = { path = "crates/hane-path" }
hane-raster = { path = "crates/hane-raster" }
hane-gpu = { path = "crates/hane-gpu" }
hane-scene = { path = "crates/hane-scene" }
hane-svg = { path = "crates/hane-svg" }
hane-edit = { path = "crates/hane-edit" }
hane-text = { path = "crates/hane-text" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
