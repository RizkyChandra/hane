<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hane</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- D-005: the chrome is DOM and holds no scene state; the engine owns the
         canvas and every document fact behind it. -->
    <div id="app">
      <header id="toolbar">
        <span id="brand" title="hane — 羽">羽</span>
        <div class="group" id="tools">
          <button data-tool="select" title="Select — V">Select</button>
          <button data-tool="rect" title="Rectangle — M">Rect</button>
          <button data-tool="ellipse" title="Ellipse — E">Ellipse</button>
          <button data-tool="pen" title="Pen — P. Click for corners, drag for curves, click the first node to close, Enter to end.">Pen</button>
          <button data-tool="rotate" title="Rotate the selection — R">Rotate</button>
          <button data-tool="pan" title="Pan — H, or drag with the middle button">Pan</button>
        </div>
        <div class="group">
          <button data-action="undo" title="Undo — Ctrl+Z">Undo</button>
          <button data-action="redo" title="Redo — Ctrl+Shift+Z">Redo</button>
          <button data-action="delete" title="Delete the selection — Del">Delete</button>
        </div>
        <div class="group">
          <button data-action="zoom-out" title="Zoom out">−</button>
          <button data-action="zoom-fit" title="Fit the page — Ctrl+0"><span id="zoom">100%</span></button>
          <button data-action="zoom-in" title="Zoom in">+</button>
        </div>
        <div class="group right">
          <button data-action="new" title="Start an empty document">New</button>
          <button id="open" title="Open an SVG — Ctrl+O">Open</button>
          <button id="save" title="Save as SVG — Ctrl+S">Save</button>
        </div>
      </header>

      <aside id="left-panel">
        <h2>Layers</h2>
        <ul id="layers"></ul>
      </aside>

      <main id="viewport"><canvas id="artboard"></canvas></main>

      <aside id="right-panel">
        <h2>Style</h2>
        <div class="row">
          <label><input type="checkbox" id="fill-on" /> Fill</label>
          <input type="color" id="fill" value="#5a6982" />
        </div>
        <div class="row">
          <label><input type="checkbox" id="stroke-on" /> Stroke</label>
          <input type="color" id="stroke" value="#000000" />
        </div>
        <div class="row">
          <label for="width">Width</label>
          <input type="number" id="width" min="0.1" step="0.5" value="1" />
        </div>
        <p class="hint" id="hint">Nothing selected — this is what the next shape gets.</p>
        <h2>Engine</h2>
        <pre id="status"></pre>
      </aside>
    </div>
    <input type="file" id="file" accept=".svg,image/svg+xml" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
