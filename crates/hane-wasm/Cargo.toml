[package]
name = "hane-wasm"
description = "The browser boundary: raw wasm exports the JS shell calls into."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib for the wasm artifact; rlib so `cargo test --workspace` can still
# compile and test this crate natively.
crate-type = ["cdylib", "rlib"]

# Deliberately NOT `workspace = true`. The workspace forbids unsafe, but this
# crate is the FFI boundary and `#[unsafe(no_mangle)]` is required to export
# symbols to JS at all. The exemption stops here -- every other crate keeps the
# workspace's `forbid`.
[lints.rust]
missing_docs = "warn"

[dependencies]
hane-geom.workspace = true
hane-path.workspace = true
hane-raster.workspace = true
hane-scene.workspace = true
hane-gpu.workspace = true
hane-svg.workspace = true
hane-edit.workspace = true
hane-text.workspace = true
wasm-bindgen = "0.2"

# D-010: this crate holds the GL and WebGPU contexts. The feature list is the
# exact set of bindings the two backends touch -- web-sys generates code per
# feature, so an unused one is dead weight in every .wasm we ship.
#
# The `Gpu*` half additionally needs `--cfg=web_sys_unstable_apis`, which
# `.cargo/config.toml` sets for the whole workspace; see the comment there.
web-sys = { version = "0.3", features = [
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "Navigator",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "Window",
    "console",
    "Gpu",
    "GpuAdapter",
    "GpuAdapterInfo",
    "GpuAutoLayoutMode",
    "GpuBindGroup",
    "GpuBindGroupDescriptor",
    "GpuBindGroupEntry",
    "GpuBindGroupLayout",
    "GpuBuffer",
    "GpuBufferBinding",
    "GpuBufferDescriptor",
    "GpuCommandBuffer",
    "GpuCommandEncoder",
    "GpuComputePassEncoder",
    "GpuComputePipeline",
    "GpuComputePipelineDescriptor",
    "GpuDevice",
    "GpuError",
    "GpuErrorFilter",
    "GpuProgrammableStage",
    "GpuQueue",
    "GpuShaderModule",
    "GpuShaderModuleDescriptor",
] }
# Only for building the getContext attribute object and the typed arrays the
# two backends upload; see `glctx.rs` and `wgpurender.rs`.
js-sys = "0.3"
# WebGPU is asynchronous down to the adapter request, so the render entry points
# are `async fn` -- which wasm-bindgen turns into a Promise through this crate.
wasm-bindgen-futures = "0.4"
