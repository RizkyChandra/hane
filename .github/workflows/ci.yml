name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # D-001. This runs first: a dependency that sneaks in should fail the
      # build before anything else has a chance to depend on it.
      - name: Zero-dependency check (D-001)
        run: python3 scripts/check-zero-deps.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # The release path compiles to wasm and bundles the shell. Both are verified
  # on every push rather than only at tag time, so a broken release pipeline is
  # found on the commit that broke it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # wasm-bindgen's CLI and its crate must be the same version or the
      # generated glue does not match the module's custom sections. Read it from
      # Cargo.lock so a `cargo update` cannot silently desync them.
      - name: wasm-bindgen version
        id: wb
        run: |
          v=$(sed -n '/^name = "wasm-bindgen"$/,/^version/{s/^version = "\(.*\)"/\1/p}' Cargo.lock | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}

      - name: Build wasm
        run: |
          cargo build --release --target wasm32-unknown-unknown -p hane-wasm
          mkdir -p web/public
          wasm-bindgen --target web --out-dir web/public --out-name hane \
            target/wasm32-unknown-unknown/release/hane_wasm.wasm
          ls -l web/public/

      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      # Both halves, not just the wasm: since #17 the shell loads the
      # wasm-bindgen glue, and a bundle with one and not the other is a page
      # that fails at runtime with a 404 nobody sees in CI.
      - name: Check the bundle contains the engine
        run: test -f web/dist/hane_bg.wasm && test -f web/dist/hane.js

      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: web/dist
          retention-days: 7
